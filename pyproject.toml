[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llms-txt-generator"
version = "0.2.0"
description = "Generate an llms.txt from a site's sitemap, and validate the one you already have."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Ángel Muñiz Pedraza", email = "angelhd029@gmail.com" }]
keywords = ["llms.txt", "geo", "seo", "ai-search", "sitemap", "technical-seo"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
]
dependencies = ["requests>=2.28"]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.urls]
Homepage = "https://github.com/angelmunizpedraza/llms-txt-generator"
Issues = "https://github.com/angelmunizpedraza/llms-txt-generator/issues"

[project.scripts]
llms-txt = "llmstxt.cli:main"

[tool.setuptools.packages.find]
include = ["llmstxt*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
